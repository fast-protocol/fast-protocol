<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST PROTOCOL | Global Interface</title>
    <!-- Подключаем тот самый шрифт Orbitron -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --emerald: #00ff41; --gold: #ffd700; --bg: #010101; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }

        /* ЗВЕЗДНОЕ НЕБО */
        .space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: black; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: drift linear infinite; }

        /* СЕТКА */
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(0, 255, 65, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.08) 1px, transparent 1px); 
            background-size: 40px 40px; z-index: -1; pointer-events: none; }

        section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; box-sizing: border-box; }

        /* ЗАГОЛОВОК */
        .neon-title { font-size: 4rem; letter-spacing: 12px; color: var(--emerald); text-shadow: 0 0 15px var(--emerald); margin-bottom: 40px; font-weight: 900; }

        /* КОНТЕЙНЕР С БОКОВЫМИ ПАНЕЛЯМИ */
        .interface-wrap { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; max-width: 1400px; }
        
        .side-monitor { width: 220px; height: 350px; border: 1px solid rgba(0, 255, 65, 0.3); background: rgba(0, 20, 0, 0.6); padding: 15px; font-family: monospace; font-size: 11px; color: var(--emerald); overflow: hidden; display: flex; flex-direction: column; box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1); }
        .monitor-label { color: #aaa; font-size: 9px; margin-bottom: 10px; border-bottom: 1px solid var(--emerald); padding-bottom: 4px; }

        .img-box { width: 650px; border: 1px solid var(--emerald); box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); border-radius: 4px; position: relative; }
        .img-box img { width: 100%; display: block; }

        /* БЕГУЩАЯ СТРОКА (МАТРИЦА) */
        .matrix-sub-box { width: 650px; height: 60px; border: 1px solid var(--emerald); margin-top: 15px; background: rgba(0,0,0,0.8); overflow: hidden; position: relative; }
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }

        @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-1000px); } }
    </style>
</head>
<body>

    <div class="space-bg" id="space"></div>
    <div class="grid-overlay"></div>

    <!-- СЕКЦИЯ 1: COMMAND -->
    <section>
        <h1 class="neon-title">FAST PROTOCOL</h1>
        <div class="interface-wrap">
            <div class="side-monitor">
                <div class="monitor-label">SYSTEM_LOGS</div>
                <div id="logs-1"></div>
            </div>
            <div class="img-box"><img src="https://raw.githubusercontent.com/fast-protocol/fast-protocol/refs/heads/main/status.png"></div>
            <div class="side-monitor">
                <div class="monitor-label">NEURAL_LINK</div>
                <div id="logs-2"></div>
            </div>
        </div>
        <div class="matrix-sub-box"><canvas id="matrix-canvas"></canvas></div>
    </section>

    <!-- СЕКЦИЯ 2: ENGINE -->
    <section>
        <div class="interface-wrap">
            <div class="side-monitor">
                <div class="monitor-label">THERMAL_CONTROL</div>
                <div id="logs-3"></div>
            </div>
            <div class="img-box" style="border-color: var(--gold);"><img src="https://raw.githubusercontent.com/fast-protocol/fast-protocol/refs/heads/main/Fast%20high-tech.png"></div>
            <div class="side-monitor">
                <div class="monitor-label">FUEL_ANALYSIS</div>
                <div id="logs-4"></div>
            </div>
        </div>
    </section>

    <!-- СЕКЦИЯ 3: TERMINAL -->
    <section>
        <div class="interface-wrap">
            <div class="side-monitor">
                <div class="monitor-label">QUANTUM_SCAN</div>
                <div id="logs-5"></div>
            </div>
            <div class="img-box"><img src="https://raw.githubusercontent.com/fast-protocol/fast-protocol/refs/heads/main/engine.png"></div>
            <div class="side-monitor">
                <div class="monitor-label">MARKET_ORACLE</div>
                <div id="logs-6"></div>
            </div>
        </div>
    </section>

    <script>
        // ГЕНЕРАЦИЯ ЗВЕЗД
        const space = document.getElementById('space');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 50 + 50) + 's';
            space.appendChild(star);
        }

        // МАТРИЦА (ПОД ПЕРВОЙ КАРТИНКОЙ)
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 650; canvas.height = 60;
        const chars = "0101FASTAAA";
        const drops = Array(40).fill(0);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41"; ctx.font = "12px monospace";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 16, y);
                if (y > canvas.height && Math.random() > 0.9) drops[i] = 0;
                else drops[i] += 12;
            });
        }
        setInterval(drawMatrix, 50);

        // ЖИВЫЕ ЛОГИ
        const phrases = ["> ACCESING CORE...", "> BTC_ORACLE: OK", "> PREDATOR_SCAN...", "> AAA_SCARCITY: 98%", "> TRAP_SET: LIMIT"];
        function addLog(id) {
            const el = document.getElementById(id);
            const div = document.createElement('div');
            div.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            el.prepend(div);
            if(el.children.length > 20) el.removeChild(el.lastChild);
        }
        setInterval(() => { ["logs-1","logs-2","logs-3","logs-4","logs-5","logs-6"].forEach(addLog); }, 2000);
    </script>
</body>
</html>
